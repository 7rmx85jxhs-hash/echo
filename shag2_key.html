<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>эхо — ключ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000; color: #c9c9c9;
    font-family: 'Courier New', monospace;
    min-height: 100vh; overflow: hidden;
    position: relative; user-select: none;
  }

  .bg-layer {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 50% 60%,
      rgba(30,25,20,0.9) 0%, rgba(10,8,5,1) 60%, #000 100%);
    animation: bgBreathe 14s ease-in-out infinite;
  }
  @keyframes bgBreathe {
    0%, 100% { opacity: 0.85; } 50% { opacity: 1; }
  }

  .candle-light {
    position: fixed; top: 20%; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 500px;
    background: radial-gradient(circle,
      rgba(255,180,80,0.15) 0%, rgba(255,150,50,0.08) 30%, transparent 70%);
    pointer-events: none; z-index: 1;
    animation: candleFlicker 0.3s infinite;
  }
  @keyframes candleFlicker {
    0% { opacity: 0.8; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.03); }
    100% { opacity: 0.85; transform: translateX(-50%) scale(0.98); }
  }

  .film-noise {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background-image: repeating-linear-gradient(0deg,
      rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px,
      transparent 1px, transparent 3px);
    opacity: 0.5;
    animation: noiseMove 0.08s steps(2) infinite;
  }
  @keyframes noiseMove {
    0% { transform: translate(0,0); } 50% { transform: translate(1px,1px); }
    100% { transform: translate(0,0); }
  }

  .vignette {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse at center,
      transparent 25%, rgba(0,0,0,0.75) 75%, rgba(0,0,0,0.98) 100%);
  }

  #timer-bar {
    position: fixed; top: 0; left: 0; height: 4px;
    background: linear-gradient(90deg, #800 0%, #f00 100%);
    z-index: 50; width: 100%;
    transition: width 1s linear;
    box-shadow: 0 0 15px rgba(255,0,0,0.6);
  }
  #timer-text {
    position: fixed; top: 12px; right: 15px;
    color: #c44; font-size: 14px; letter-spacing: 3px;
    z-index: 50; font-family: 'Courier New', monospace;
    text-shadow: 0 0 8px rgba(255,0,0,0.5);
  }

  .stage {
    position: relative; z-index: 5;
    max-width: 800px; margin: 0 auto;
    padding: 40px 20px; min-height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center; text-align: center;
  }

  #text {
    font-size: 17px; line-height: 1.8;
    white-space: pre-wrap;
    text-shadow: 0 0 10px rgba(200,170,120,0.3);
    min-height: 120px;
  }

  .cursor {
    display: inline-block; width: 9px; height: 17px;
    background: #c9c9c9; animation: blink 1s infinite;
    vertical-align: middle; margin-left: 2px;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; }
  }

  #hallway {
    display: none; margin-top: 30px;
    justify-content: center; align-items: flex-end;
    gap: 8px; flex-wrap: wrap;
  }
  #hallway.visible { display: flex; animation: fadeIn 2s forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .door {
    width: 90px; height: 180px; position: relative;
    cursor: pointer; transition: all 0.4s;
    display: flex; align-items: flex-end;
    justify-content: center; padding-bottom: 8px;
    font-size: 10px; letter-spacing: 1px;
    color: rgba(180,160,120,0.6);
  }
  .door:hover { transform: translateY(-5px); filter: brightness(1.2); }
  .door.done { opacity: 0.35; pointer-events: none; }
  .door.done::after {
    content: '✓'; position: absolute; top: 6px; right: 8px;
    color: #7a9a7a; font-size: 14px;
  }

  .door[data-door="1"] {
    background: linear-gradient(180deg, #3a2515 0%, #2a1a0f 50%, #1a1008 100%);
    border: 2px solid #4a3520; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
  }
  .door[data-door="2"] {
    background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 50%, #0a0a0a 100%);
    border: 2px solid #3a3a3a; box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
  }
  .door[data-door="2"]::before {
    content: ''; position: absolute; inset: 10px;
    background: repeating-linear-gradient(45deg,
      transparent 0px, transparent 8px,
      rgba(200,0,0,0.15) 8px, rgba(200,0,0,0.15) 9px);
    pointer-events: none;
  }
  .door[data-door="3"] {
    background: linear-gradient(180deg, #0a0a0a 0%, #050505 50%, #000 100%);
    border: 2px solid #1a1a1a;
    box-shadow: inset 0 0 40px rgba(0,0,0,1), 0 0 25px rgba(120,100,60,0.15);
  }
  .door[data-door="4"] {
    background: linear-gradient(180deg, #2a2018 0%, #1a1008 50%, #0a0505 100%);
    border: 2px solid #3a2820; position: relative;
  }
  .door[data-door="4"]::before {
    content: ''; position: absolute; top: 40%; left: 0; right: 0; height: 6px;
    background: repeating-linear-gradient(90deg,
      #666 0px, #666 4px, #333 4px, #333 8px);
    box-shadow: 0 0 5px rgba(0,0,0,0.8);
  }
  .door[data-door="4"] .peep {
    position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
    width: 14px; height: 14px;
    background: radial-gradient(circle at 50% 40%, #000 60%, #555 100%);
    border-radius: 50%; border: 2px solid #888;
    box-shadow: 0 0 8px rgba(0,0,0,1);
  }
  .door[data-door="5"] {
    background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
    border: 2px solid #2a2a2a;
    transform: perspective(400px) rotateY(-15deg);
    transform-origin: left center;
    box-shadow: inset 20px 0 30px rgba(255,200,100,0.15);
  }

  .hand-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6);
  }
  .hand-overlay.active { display: flex; animation: fadeIn 0.5s; }

  .hand {
    position: relative; width: 200px; height: 350px;
    animation: handReach 3s ease-out forwards;
  }
  @keyframes handReach {
    0% { transform: translateY(-400px) rotate(-20deg); opacity: 0; }
    100% { transform: translateY(0) rotate(0); opacity: 1; }
  }
  .hand-palm {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 140px; height: 180px;
    background: linear-gradient(180deg, #d4c5b0 0%, #b8a58c 60%, #8a7560 100%);
    border-radius: 40% 40% 50% 50%;
    box-shadow: inset 0 0 30px rgba(80,60,50,0.5), 0 0 40px rgba(0,0,0,0.8);
  }
  .finger {
    position: absolute; bottom: 165px; width: 25px; height: 100px;
    background: linear-gradient(180deg, #d4c5b0 0%, #b8a58c 100%);
    border-radius: 50% 50% 30% 30%;
    box-shadow: inset 0 0 15px rgba(80,60,50,0.4);
    transform-origin: bottom center;
  }
  .finger.f1 { left: 15px; height: 90px; transform: rotate(-8deg); }
  .finger.f2 { left: 45px; height: 110px; }
  .finger.f3 { left: 75px; height: 115px; }
  .finger.f4 { left: 105px; height: 100px; transform: rotate(6deg); }

  .hand-buttons {
    position: absolute; bottom: -80px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px;
  }
  .hand-btn {
    background: transparent; border: 1px solid #666; color: #ccc;
    font-family: 'Courier New', monospace; font-size: 11px;
    letter-spacing: 2px; padding: 10px 15px; cursor: pointer;
    transition: all 0.3s;
  }
  .hand-btn:hover { border-color: #c9c9c9; background: rgba(200,200,200,0.05); }

  .peephole-view {
    position: fixed; inset: 0; z-index: 100;
    display: none; align-items: center; justify-content: center;
    background: #000;
  }
  .peephole-view.active { display: flex; }

  .peephole-circle {
    width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(30,25,20,0.95) 0%, rgba(10,8,5,1) 70%, #000 100%);
    border: 5px solid #1a1a1a;
    box-shadow: inset 0 0 60px rgba(0,0,0,1), 0 0 80px rgba(0,0,0,1);
    position: relative; overflow: hidden;
    animation: peepholeZoom 1.5s ease-out;
  }
  @keyframes peepholeZoom {
    0% { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .skeleton {
    position: absolute; bottom: -20px; left: 50%;
    transform: translateX(-50%); width: 200px; height: 320px;
    animation: skeletonSway 6s ease-in-out infinite;
  }
  @keyframes skeletonSway {
    0%, 100% { transform: translateX(-50%) rotate(-1deg); }
    50% { transform: translateX(-50%) rotate(1deg); }
  }
  .skull {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 100px; height: 110px;
    background: radial-gradient(ellipse at center,
      #e8d8c0 0%, #c8b8a0 40%, #8a7a68 100%);
    border-radius: 50% 50% 45% 45%;
    box-shadow: inset 0 0 30px rgba(80,60,50,0.6),
                inset 0 -20px 20px rgba(0,0,0,0.4),
                0 0 20px rgba(0,0,0,0.8);
  }
  .eye-socket {
    position: absolute; top: 35%; width: 30px; height: 35px;
    background: radial-gradient(ellipse at center,
      #000 0%, #000 40%, #1a0f08 70%, #2a1a10 100%);
    border-radius: 50%; box-shadow: inset 0 0 15px rgba(0,0,0,1);
  }
  .eye-socket.left { left: 15%; }
  .eye-socket.right { right: 15%; }
  .eye-socket.left::after {
    content: ''; position: absolute; top: 40%; left: 50%;
    transform: translate(-50%, -50%); width: 6px; height: 6px;
    background: #ffcc00; border-radius: 50%;
    box-shadow: 0 0 10px #ffcc00, 0 0 20px #ff8800;
    animation: eyeGlow 2s ease-in-out infinite;
  }
  @keyframes eyeGlow {
    0%, 100% { opacity: 0.6; } 50% { opacity: 1; }
  }
  .nose-cavity {
    position: absolute; top: 55%; left: 50%; transform: translateX(-50%);
    width: 15px; height: 20px; background: #000;
    border-radius: 50% 50% 20% 20%;
    box-shadow: inset 0 0 10px #000;
  }
  .jaw {
    position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
    width: 90px; height: 30px;
    background: linear-gradient(180deg, #c8b8a0 0%, #8a7a68 100%);
    border-radius: 20% 20% 50% 50%;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
  }
  .teeth {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 3px;
  }
  .tooth {
    width: 6px; height: 8px; background: #d4c5b0;
    border-radius: 0 0 30% 30%;
    box-shadow: inset 0 0 3px rgba(0,0,0,0.4);
  }
  .ribs {
    position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 130px;
  }
  .rib {
    position: absolute; width: 100%; height: 4px;
    background: linear-gradient(90deg,
      transparent 0%, #c8b8a0 20%, #e8d8c0 50%, #c8b8a0 80%, transparent 100%);
    border-radius: 2px; box-shadow: 0 0 5px rgba(0,0,0,0.6);
  }
  .rib:nth-child(1) { top: 0; width: 90%; left: 5%; }
  .rib:nth-child(2) { top: 25px; width: 95%; left: 2.5%; }
  .rib:nth-child(3) { top: 50px; width: 100%; }
  .rib:nth-child(4) { top: 75px; width: 95%; left: 2.5%; }
  .rib:nth-child(5) { top: 100px; width: 80%; left: 10%; }
  .chain-link {
    position: absolute; width: 12px; height: 20px;
    border: 2px solid #666; border-radius: 50%;
    box-shadow: 0 0 3px rgba(0,0,0,0.8);
  }
  .chain-link.left { top: 130px; left: -10px; transform: rotate(-20deg); }
  .chain-link.right { top: 130px; right: -10px; transform: rotate(20deg); }
  .chain-link.left2 { top: 160px; left: -5px; transform: rotate(-15deg); }
  .chain-link.right2 { top: 160px; right: -5px; transform: rotate(15deg); }
  .handcuff {
    position: absolute; width: 30px; height: 30px;
    border: 4px solid #888; border-radius: 50%;
    box-shadow: 0 0 10px rgba(0,0,0,0.8), inset 0 0 5px rgba(0,0,0,0.6);
  }
  .handcuff.left { top: 165px; left: -15px; }
  .handcuff.right { top: 165px; right: -15px; }

  .writing-hand {
    position: absolute; top: 40%; right: 10%;
    width: 30px; height: 60px;
    background: linear-gradient(180deg, #c8b8a0 0%, #8a7a68 100%);
    border-radius: 30% 30% 40% 40%; opacity: 0;
    box-shadow: 0 0 15px rgba(0,0,0,0.8);
    transform-origin: top center;
  }
  .writing-hand.active {
    opacity: 1;
    animation: writeMove 3s ease-in-out infinite;
  }
  @keyframes writeMove {
    0%, 100% { transform: rotate(-10deg) translateY(0); }
    50% { transform: rotate(10deg) translateY(10px); }
  }

  .wall-code {
    position: absolute; top: 30%; right: 5%;
    display: flex; gap: 15px; opacity: 0;
    transition: opacity 2s;
  }
  .wall-code.visible { opacity: 1; }
  .code-digit {
    font-size: 60px; font-family: 'Courier New', monospace;
    color: #a05050;
    text-shadow: 0 0 20px rgba(200,50,50,0.8), 0 0 40px rgba(200,50,50,0.4);
    animation: digitAppear 0.8s forwards;
    opacity: 0; transform: scale(0.5);
  }
  @keyframes digitAppear {
    to { opacity: 1; transform: scale(1); }
  }

  .peephole-buttons {
    position: absolute; bottom: -80px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 15px;
  }
  .peephole-btn {
    background: transparent; border: 1px solid #666; color: #ccc;
    font-family: 'Courier New', monospace; font-size: 12px;
    letter-spacing: 2px; padding: 12px 20px; cursor: pointer;
    transition: all 0.3s;
  }
  .peephole-btn:hover { border-color: #c9c9c9; background: rgba(200,200,200,0.05); }

  .riddle-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.95); padding: 20px;
  }
  .riddle-overlay.active { display: flex; animation: fadeIn 1s; }
  .riddle-box { max-width: 500px; width: 100%; text-align: center; }
  .riddle-question {
    font-size: 20px; line-height: 1.7; margin-bottom: 40px;
    color: #d0c0a0;
    text-shadow: 0 0 15px rgba(200,150,80,0.5);
    white-space: pre-wrap;
  }
  .riddle-options {
    display: flex; flex-direction: column; gap: 12px;
  }
  .riddle-option {
    background: transparent; border: 1px solid #555; color: #c9c9c9;
    font-family: 'Courier New', monospace; font-size: 15px;
    letter-spacing: 2px; padding: 15px 25px; cursor: pointer;
    transition: all 0.3s;
  }
  .riddle-option:hover {
    border-color: #c9a060; background: rgba(200,150,80,0.08);
    box-shadow: 0 0 20px rgba(200,150,80,0.2);
  }
  .riddle-response {
    margin-top: 30px; font-size: 16px; line-height: 1.8;
    color: #d0b090; font-style: italic;
    min-height: 80px; white-space: pre-wrap;
  }

  .gameover {
    position: fixed; inset: 0; z-index: 500;
    display: none; align-items: center; justify-content: center;
    padding: 30px; text-align: center;
  }
  .gameover.active { display: flex; animation: gameoverFade 2s forwards; }
  @keyframes gameoverFade {
    from { opacity: 0; } to { opacity: 1; }
  }
  .gameover-content {
    max-width: 600px; font-size: 22px; line-height: 1.6;
    letter-spacing: 2px; font-style: italic;
  }
  .gameover.good {
    background: radial-gradient(ellipse at center,
      rgba(255,250,240,0.95) 0%, rgba(240,230,210,0.9) 40%,
      rgba(200,180,150,0.95) 100%);
  }
  .gameover.good .gameover-content {
    color: #4a3a20; text-shadow: 0 0 20px rgba(255,240,200,0.8);
  }
  .gameover.scare {
    background: radial-gradient(ellipse at center,
      rgba(180,0,0,0.95) 0%, rgba(100,0,0,0.98) 50%, #000 100%);
  }
  .gameover.scare .gameover-content {
    color: #ffcccc;
    text-shadow: 0 0 25px rgba(255,50,50,0.9);
    animation: gameoverShake 0.15s infinite;
  }
  @keyframes gameoverShake {
    0% { transform: translate(0,0); }
    50% { transform: translate(-2px, 2px); }
    100% { transform: translate(2px, -2px); }
  }
  .gameover.bad { background: #000; }
  .gameover.bad .gameover-content {
    color: #666; text-shadow: 0 0 15px rgba(100,100,100,0.3);
  }
  .gameover.secret {
    background: radial-gradient(ellipse at center,
      rgba(60,20,80,0.95) 0%, rgba(30,10,40,0.98) 50%, #000 100%);
  }
  .gameover.secret .gameover-content {
    color: #d0a0e0; text-shadow: 0 0 25px rgba(180,80,220,0.8);
  }
  .gameover-return {
    margin-top: 60px; background: transparent;
    border: 1px solid rgba(255,255,255,0.4); color: inherit;
    font-family: 'Courier New', monospace; font-size: 13px;
    letter-spacing: 3px; padding: 15px 30px; cursor: pointer;
    transition: all 0.3s; opacity: 0;
    animation: btnShow 1s 3s forwards;
  }
  @keyframes btnShow { to { opacity: 1; } }
  .gameover-return:hover { border-color: #fff; letter-spacing: 5px; }

  #sound-btn {
    position: fixed; bottom: 20px; right: 20px;
    background: transparent; border: 1px solid #444; color: #888;
    font-family: 'Courier New', monospace; font-size: 11px;
    padding: 8px 14px; cursor: pointer; letter-spacing: 2px;
    z-index: 200; transition: all 0.3s;
  }
  #sound-btn.on { border-color: #5a7a5a; color: #7a9a7a; }

  .particle {
    position: fixed; width: 2px; height: 2px;
    background: rgba(200,180,140,0.5); border-radius: 50%;
    pointer-events: none; z-index: 4;
    animation: particleFloat linear infinite;
  }
  @keyframes particleFloat {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: 0.7; } 90% { opacity: 0.7; }
    100% { transform: translateY(-100vh); opacity: 0; }
  }

  .passing-shadow {
    position: fixed; top: 0; left: -300px; width: 300px; height: 100vh;
    background: linear-gradient(90deg,
      transparent 0%, rgba(0,0,0,0.85) 50%, transparent 100%);
    z-index: 8; pointer-events: none; opacity: 0;
  }
  .passing-shadow.run { animation: shadowRun2 2s ease-in-out forwards; }
  @keyframes shadowRun2 {
    0% { left: -300px; opacity: 0; }
    20% { opacity: 0.7; } 80% { opacity: 0.7; }
    100% { left: 100vw; opacity: 0; }
  }

  body.shake { animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-4px, -3px); }
    80% { transform: translate(4px, 3px); }
  }

  .jumpscare {
    position: fixed; inset: 0; z-index: 999;
    display: none; align-items: center; justify-content: center;
    background: #000; pointer-events: none;
  }
  .jumpscare.active { display: flex; animation: scareFlash 0.15s; }
  @keyframes scareFlash {
    0% { background: #fff; } 30% { background: #500; }
    100% { background: #000; }
  }
  .scare-face {
    position: relative; width: 300px; height: 400px;
    animation: faceShake 0.1s infinite;
  }
  @keyframes faceShake {
    0% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-5px,3px) scale(1.05); }
    100% { transform: translate(5px,-3px) scale(1.02); }
  }
  .face-head {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center,
      #2a1a1a 0%, #0a0505 70%, #000 100%);
    border-radius: 50% 50% 45% 45%;
    box-shadow: inset 0 0 60px rgba(255,0,0,0.3);
  }
  .face-eye {
    position: absolute; top: 35%; width: 60px; height: 40px;
    background: #fff; border-radius: 50%;
    box-shadow: 0 0 30px rgba(255,255,255,0.9),
                inset 0 0 15px rgba(200,0,0,0.8);
  }
  .face-eye.left { left: 25%; }
  .face-eye.right { right: 25%; }
  .face-eye::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); width: 18px; height: 18px;
    background: #000; border-radius: 50%;
  }
  .face-mouth {
    position: absolute; bottom: 22%; left: 50%; transform: translateX(-50%);
    width: 90px; height: 120px; background: #000;
    border-radius: 40% 40% 50% 50%;
    box-shadow: inset 0 0 20px #500, 0 0 30px rgba(150,0,0,0.5);
  }
  .face-mouth::before, .face-mouth::after {
    content: ''; position: absolute; width: 8px; height: 30px;
    background: #ddd; top: 5px;
  }
  .face-mouth::before { left: 20%; }
  .face-mouth::after { right: 20%; }

  .interlude {
    position: fixed; inset: 0; z-index: 800;
    background: #000; display: flex;
    align-items: center; justify-content: center;
    padding: 40px; text-align: center;
    color: #c9c9c9; font-family: 'Courier New', monospace;
    font-size: 18px; line-height: 1.8; white-space: pre-wrap;
    animation: fadeIn 1.5s;
  }
</style>
</head>
<body>

<div id="timer-bar"></div>
<div id="timer-text">3:00</div>

<div class="bg-layer"></div>
<div class="candle-light"></div>
<div class="film-noise"></div>
<div class="vignette"></div>
<div class="passing-shadow" id="passingShadow"></div>

<div class="stage">
  <div id="text"></div>
  <div id="hallway">
    <div class="door" data-door="1">I</div>
    <div class="door" data-door="2">II</div>
    <div class="door" data-door="3">III</div>
    <div class="door" data-door="4">IV<span class="peep"></span></div>
    <div class="door" data-door="5">V</div>
  </div>
</div>

<div class="hand-overlay" id="handOverlay">
  <div class="hand">
    <div class="hand-palm"></div>
    <div class="finger f1"></div>
    <div class="finger f2"></div>
    <div class="finger f3"></div>
    <div class="finger f4"></div>
    <div class="hand-buttons">
      <button class="hand-btn" data-hand="away">ОТШАТНУТЬСЯ</button>
      <button class="hand-btn" data-hand="stay">СТОЯТЬ</button>
      <button class="hand-btn" data-hand="reach">ПРОТЯНУТЬ РУКУ</button>
    </div>
  </div>
</div>

<div class="peephole-view" id="peepholeView">
  <div class="peephole-circle">
    <div class="skeleton">
      <div class="skull">
        <div class="eye-socket left"></div>
        <div class="eye-socket right"></div>
        <div class="nose-cavity"></div>
        <div class="jaw">
          <div class="teeth">
            <div class="tooth"></div><div class="tooth"></div><div class="tooth"></div>
            <div class="tooth"></div><div class="tooth"></div>
          </div>
        </div>
      </div>
      <div class="ribs">
        <div class="rib"></div><div class="rib"></div><div class="rib"></div>
        <div class="rib"></div><div class="rib"></div>
      </div>
      <div class="chain-link left"></div>
      <div class="chain-link right"></div>
      <div class="chain-link left2"></div>
      <div class="chain-link right2"></div>
      <div class="handcuff left"></div>
      <div class="handcuff right"></div>
    </div>
    <div class="writing-hand" id="writingHand"></div>
    <div class="wall-code" id="wallCode">
      <div class="code-digit" style="animation-delay: 0s;">7</div>
      <div class="code-digit" style="animation-delay: 0.6s;">0</div>
      <div class="code-digit" style="animation-delay: 1.2s;">1</div>
      <div class="code-digit" style="animation-delay: 1.8s;">4</div>
    </div>
  </div>
  <div class="peephole-buttons">
    <button class="peephole-btn" data-peep="leave">ОТОЙТИ</button>
    <button class="peephole-btn" data-peep="stay">ОСТАТЬСЯ</button>
  </div>
</div>

<div class="riddle-overlay" id="riddleOverlay">
  <div class="riddle-box">
    <div class="riddle-question" id="riddleQuestion"></div>
    <div class="riddle-options" id="riddleOptions"></div>
    <div class="riddle-response" id="riddleResponse"></div>
  </div>
</div>

<div class="gameover" id="gameover">
  <div>
    <div class="gameover-content" id="gameoverContent"></div>
    <button class="gameover-return" id="gameoverReturn">ВЕРНУТЬСЯ</button>
  </div>
</div>

<div class="jumpscare" id="jumpscare">
  <div class="scare-face">
    <div class="face-head"></div>
    <div class="face-eye left"></div>
    <div class="face-eye right"></div>
    <div class="face-mouth"></div>
  </div>
</div>

<button id="sound-btn">ЗВУК ВКЛ</button>

<script>
  // ============ ЗВУКИ ============
  const SOUNDS = {
    hum1: 'hum1.mp3', hum2: 'hum2.mp3', music: 'music.mp3',
    click1: 'click1.mp3', click2: 'click2.mp3',
    whisper1: 'whisper1.mp3', whisper2: 'whisper2.mp3', whisper3: 'whisper3.mp3',
    noise1: 'noise1.mp3', noise2: 'noise2.mp3', noise3: 'noise3.mp3',
    scream1: 'scream1.mp3', scream2: 'scream2.mp3',
    heartbeat: 'heartbeat.mp3', door_creak: 'door_creak.mp3',
    chain: 'chain.mp3', breath: 'breath.mp3', wind: 'wind.mp3',
    child_laugh: 'child_laugh.mp3', metal_clang: 'metal_clang.mp3',
    glass_break: 'glass_break.mp3', female_scream: 'female_scream.mp3',
    whisper_name: 'whisper_name.mp3', clock_tick: 'clock_tick.mp3',
    footsteps: 'footsteps.mp3', gameover_dark: 'gameover_dark.mp3',
    gameover_light: 'gameover_light.mp3', blood_splash: 'blood_splash.mp3',
    reveal: 'reveal.mp3'
  };

  const audioCache = {};
  Object.keys(SOUNDS).forEach(k => { audioCache[k] = new Audio(SOUNDS[k]); });

  audioCache.hum1.loop = true; audioCache.hum1.volume = 0.12;
  audioCache.hum2.loop = true; audioCache.hum2.volume = 0.1;
  audioCache.music.loop = true; audioCache.music.volume = 0.15;
  audioCache.wind.loop = true; audioCache.wind.volume = 0.1;
  audioCache.heartbeat.loop = true; audioCache.heartbeat.volume = 0.4;
  audioCache.clock_tick.loop = true; audioCache.clock_tick.volume = 0.15;

  let soundOn = false;
  const soundBtn = document.getElementById('sound-btn');

  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    if (soundOn) {
      audioCache.hum1.play().catch(()=>{});
      audioCache.hum2.play().catch(()=>{});
      audioCache.music.play().catch(()=>{});
      audioCache.wind.play().catch(()=>{});
      audioCache.clock_tick.play().catch(()=>{});
      soundBtn.textContent = 'ЗВУК ВЫКЛ';
      soundBtn.classList.add('on');
    } else {
      Object.values(audioCache).forEach(a => a.pause());
      soundBtn.textContent = 'ЗВУК ВКЛ';
      soundBtn.classList.remove('on');
    }
  });

  function play(name, volume) {
    if (!soundOn || !audioCache[name]) return;
    audioCache[name].currentTime = 0;
    if (volume !== undefined) audioCache[name].volume = volume;
    audioCache[name].play().catch(()=>{});
  }

  function playRandom(arr) {
    if (!soundOn) return;
    play(arr[Math.floor(Math.random() * arr.length)]);
  }

  function speak(text, opts = {}) {
    if (!soundOn) return;
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU';
    u.rate = opts.rate || 0.75;
    u.pitch = opts.pitch || 0.4;
    u.volume = opts.volume || 0.8;
    speechSynthesis.speak(u);
  }

  // ============ ЭЛЕМЕНТЫ ============
  const textEl = document.getElementById('text');
  const hallwayEl = document.getElementById('hallway');
  const timerBar = document.getElementById('timer-bar');
  const timerText = document.getElementById('timer-text');
  const handOverlay = document.getElementById('handOverlay');
  const peepholeView = document.getElementById('peepholeView');
  const writingHand = document.getElementById('writingHand');
  const wallCode = document.getElementById('wallCode');
  const riddleOverlay = document.getElementById('riddleOverlay');
  const riddleQuestion = document.getElementById('riddleQuestion');
  const riddleOptions = document.getElementById('riddleOptions');
  const riddleResponse = document.getElementById('riddleResponse');
  const gameover = document.getElementById('gameover');
  const gameoverContent = document.getElementById('gameoverContent');
  const gameoverReturn = document.getElementById('gameoverReturn');
  const jumpscare = document.getElementById('jumpscare');
  const passingShadow = document.getElementById('passingShadow');

  const cursorEl = document.createElement('span');
  cursorEl.className = 'cursor';

  // ============ ТАЙМЕР ============
  let timeLeft = 180;
  let timerInterval;
  let gameEnded = false;

  function startTimer() {
    timerInterval = setInterval(() => {
      if (gameEnded) return;
      timeLeft--;
      const min = Math.floor(timeLeft / 60);
      const sec = timeLeft % 60;
      timerText.textContent = `${min}:${sec.toString().padStart(2, '0')}`;
      timerBar.style.width = (timeLeft / 180 * 100) + '%';
      if (timeLeft < 60 && timeLeft > 0) {
        if (timeLeft % 2 === 0) play('heartbeat', 0.5);
      }
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        endGame('bad');
      }
    }, 1000);
  }

  // ============ ВСТУПЛЕНИЕ ============
  const intro = [
    { text: "Ты выбрала ключ.", pause: 1500 },
    { text: "\n\n", pause: 700 },
    { text: "И оказалась в коридоре.", pause: 1800 },
    { text: "\n\n", pause: 700 },
    { text: "Пять дверей. Все заперты.", pause: 1800 },
    { text: "\n\n", pause: 700 },
    { text: "Ключ в твоей руке тёплый.", pause: 1500 },
    { text: "\n\n", pause: 1000 },
    { text: "Он чувствует.", pause: 1500 },
    { text: "\n\n", pause: 800 },
    { text: "Найди ту, что обжигает.", pause: 0 }
  ];

  let currentLine = 0;
  let currentChar = 0;

  function typeNext() {
    if (currentLine >= intro.length) {
      setTimeout(() => {
        hallwayEl.classList.add('visible');
        speak('Ты нашла ключ.', { rate: 0.7, pitch: 0.3 });
        startTimer();
        startAtmosphere();
      }, 800);
      return;
    }
    const line = intro[currentLine];
    if (currentChar < line.text.length) {
      textEl.textContent += line.text[currentChar];
      currentChar++;
      textEl.appendChild(cursorEl);
      const ch = line.text[currentChar - 1];
      let speed = 55;
      if (ch === '.' || ch === '?' || ch === '!') speed = 400;
      if (ch === ',') speed = 200;
      if (Math.random() < 0.25) playRandom(['click1','click2']);
      setTimeout(typeNext, speed);
    } else {
      currentLine++;
      currentChar = 0;
      setTimeout(typeNext, line.pause);
    }
  }

  // ============ ЧАСТИЦЫ ============
  function spawnParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.bottom = '-10px';
    p.style.animationDuration = (8 + Math.random() * 10) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 20000);
  }
  setInterval(spawnParticle, 800);

  // ============ АТМОСФЕРА ============
  function runShadow() {
    passingShadow.classList.add('run');
    setTimeout(() => passingShadow.classList.remove('run'), 2000);
    playRandom(['whisper1','whisper2','whisper3']);
  }

  function startAtmosphere() {
    setInterval(() => {
      if (Math.random() < 0.4 && !gameEnded) runShadow();
    }, 12000);
  }

  // ============ СКРИМЕР ============
  function doJumpscare(sound = 'scream1') {
    play(sound, 0.6);
    jumpscare.classList.add('active');
    document.body.classList.add('shake');
    setTimeout(() => {
      jumpscare.classList.remove('active');
      document.body.classList.remove('shake');
    }, 1200);
  }

  // ============ ИНТЕРЛЮДИЯ ============
  function showScareInterlude(text) {
    const interlude = document.createElement('div');
    interlude.className = 'interlude';
    interlude.textContent = text;
    document.body.appendChild(interlude);
    speak(text.substring(0, 50), { rate: 0.6, pitch: 0.3 });
    setTimeout(() => {
      interlude.style.transition = 'opacity 1.5s';
      interlude.style.opacity = '0';
      setTimeout(() => {
        interlude.remove();
        textEl.textContent = "Выбирай следующую дверь.";
        textEl.appendChild(cursorEl);
      }, 1500);
    }, 4000);
  }

  // ============ ДВЕРИ ============
  let handResolved = false;
  let peepholeResolved = false;
  let riddleDone = false;

  document.querySelectorAll('.door').forEach(door => {
    door.addEventListener('click', () => {
      if (gameEnded) return;
      const n = door.dataset.door;
      if (door.classList.contains('done')) return;
      door.classList.add('done');

      playRandom(['click1','click2']);

      const reactions = {
        '1': { text: "Ключ теплеет. Едва-едва.\n\nЗа дверью — тишина. Но не пустая.\n\nКто-то слушает.", sound: 'whisper1' },
        '2': { text: "Ключ леденеет.\n\nПо железу — царапины.\n\nНе снаружи. Изнутри.", sound: 'door_creak' },
        '3': { text: "Ключ обжигает ладонь.\n\nТы вскрикиваешь и отнимаешь руку.\n\nЭто она.", sound: 'heartbeat' },
        '4': { text: "Ключ дрожит.\n\nВ двери — глазок.\n\nТы чувствуешь, что за ней кто-то есть.", sound: 'chain' },
        '5': { text: "Ключ пульсирует.\n\nДверь приоткрыта. Из щели — свет.\n\nТёплый. Живой.", sound: 'breath' }
      };

      const r = reactions[n];
      play(r.sound);
      textEl.textContent = r.text;
      textEl.appendChild(cursorEl);

      if (n === '2' && !handResolved) {
        setTimeout(() => showHandScene(), 1800);
      } else if (n === '4' && !peepholeResolved) {
        setTimeout(() => showPeepholeScene(), 1800);
      } else if (n === '5') {
        setTimeout(() => {
          play('glass_break');
          doJumpscare('scream2');
          setTimeout(() => {
            showScareInterlude("Силуэт метнулся в сторону.\n\nНо не напал.\n\nОн ушёл. И что-то оставил.");
          }, 1500);
        }, 1200);
      } else if (n === '3' && !riddleDone) {
        setTimeout(() => showRiddle(), 2000);
      }
    });
  });

  // ============ РУКА ============
  function showHandScene() {
    play('door_creak');
    setTimeout(() => {
      handOverlay.classList.add('active');
      play('breath');
      speak('Не открывай.', { rate: 0.6, pitch: 0.2, volume: 0.6 });
    }, 500);
  }

  document.querySelectorAll('.hand-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (handResolved) return;
      handResolved = true;
      const choice = btn.dataset.hand;
      handOverlay.classList.remove('active');

      if (choice === 'away') {
        play('whisper1');
        setTimeout(() => {
          textEl.textContent = "Ты отшатнулась.\n\nРука медленно ушла в щель.\n\nНо она запомнила.";
        }, 500);
      } else if (choice === 'stay') {
        play('noise1');
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 400);
        setTimeout(() => {
          textEl.textContent = "Рука коснулась твоего лица.\n\nХолодная. Сухая.\n\nИ — исчезла.";
        }, 500);
      } else if (choice === 'reach') {
        play('metal_clang');
        doJumpscare('scream1');
        setTimeout(() => {
          showScareInterlude("Ты закричала.\n\nНо рука отпустила.\n\nИ ты поняла — это только начало.");
        }, 1500);
      }
    });
  });

  // ============ ГЛАЗОК ============
  function showPeepholeScene() {
    play('chain');
    setTimeout(() => {
      peepholeView.classList.add('active');
      play('breath');
    }, 500);
  }

  document.querySelectorAll('.peephole-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (peepholeResolved) return;
      peepholeResolved = true;
      const choice = btn.dataset.peep;

      if (choice === 'leave') {
        play('noise2');
        peepholeView.classList.remove('active');
        setTimeout(() => {
          textEl.textContent = "Ты отвела взгляд.\n\nЖенщина осталась там. Одна.";
        }, 500);
      } else if (choice === 'stay') {
        writingHand.classList.add('active');
        play('chain');
        speak('Ты пришла. Значит, ты уже знаешь. Смотри.', { rate: 0.6, pitch: 0.2, volume: 0.7 });
        setTimeout(() => {
          wallCode.classList.add('visible');
          play('reveal');
        }, 3000);
        setTimeout(() => {
          localStorage.setItem('echo_key_code', '7014');
        }, 5000);
        setTimeout(() => {
          peepholeView.classList.remove('active');
          textEl.textContent = "Она показала тебе что-то.\n\nТы не знаешь, что это значит.\n\nПока.";
          setTimeout(() => endGame('secret'), 3000);
        }, 8000);
      }
    });
  });

  // ============ ЗАГАДКА ============
  const riddleOpts = [
    { key: 'truth', label: 'ПРАВДУ', response: 'Правда — это то, что ты не хочешь знать.\n\nТы уверена?' },
    { key: 'death', label: 'СМЕРТЬ', response: 'Смерть — это не конец.\n\nЭто эхо, которое не возвращается.' },
    { key: 'love', label: 'ЛЮБОВЬ', response: 'Любовь — это то, за что ты уже заплатила.\n\nИ заплатишь ещё.' },
    { key: 'self', label: 'СЕБЯ', response: 'Себя нельзя найти.\n\nСебя можно только потерять. И найти заново.' },
    { key: 'nothing', label: 'НИЧЕГО', response: 'Ничего — это тоже ответ.\n\nИ, возможно, самый честный.' }
  ];

  function showRiddle() {
    riddleDone = true;
    riddleQuestion.textContent = "«Ты нашла её. Но чтобы открыть — ответь.\n\nЧто ты ищешь?»";
    riddleOptions.innerHTML = '';
    riddleResponse.textContent = '';

    riddleOpts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'riddle-option';
      btn.textContent = opt.label;
      btn.addEventListener('click', () => {
        playRandom(['whisper1','whisper2','whisper3']);
        riddleResponse.textContent = opt.response;
        riddleOptions.querySelectorAll('.riddle-option').forEach(b => b.disabled = true);
        setTimeout(() => {
          riddleOverlay.classList.remove('active');
          textEl.textContent = "Дверь открылась.\n\nЗа ней — пустота. Только свет.";
          setTimeout(() => endGame('good'), 2500);
        }, 3000);
      });
      riddleOptions.appendChild(btn);
    });
    riddleOverlay.classList.add('active');
    play('metal_clang');
  }

  // ============ КОНЦОВКИ ============
  function endGame(type) {
    if (gameEnded) return;
    gameEnded = true;
    clearInterval(timerInterval);
    document.getElementById('timer-bar').style.display = 'none';
    document.getElementById('timer-text').style.display = 'none';
    Object.values(audioCache).forEach(a => { if (a.loop) a.pause(); });

    const endings = {
      good: {
        class: 'good',
        text: 'Тьма — это не конец.\n\nЭто начало пути.',
        sound: 'gameover_light',
        speakText: 'Тьма — это не конец. Это начало пути.'
      },
      scare: {
        class: 'scare',
        text: 'Некоторые двери не открывают.\n\nИх открывают тебя.',
        sound: 'blood_splash',
        speakText: 'Некоторые двери не открывают. Их открывают тебя.'
      },
      bad: {
        class: 'bad',
        text: 'Время — единственное, что не возвращается.\n\nТы потеряла его.',
        sound: 'gameover_dark',
        speakText: 'Время — единственное, что не возвращается. Ты потеряла его.'
      },
      secret: {
        class: 'secret',
        text: 'Смерть — это не конец.\n\nЭто эхо, которое не возвращается.',
        sound: 'reveal',
        speakText: 'Смерть — это не конец. Это эхо, которое не возвращается.'
      }
    };

    const e = endings[type];
    gameover.className = 'gameover ' + e.class;
    gameoverContent.textContent = e.text;
    play(e.sound);
    setTimeout(() => speak(e.speakText, { rate: 0.7, pitch: 0.3, volume: 0.9 }), 1000);
    gameover.classList.add('active');

    if (type === 'good' || type === 'secret') {
      localStorage.setItem('echo_key_done', 'true');
    }
  }

  gameoverReturn.addEventListener('click', () => {
    play('noise1');
    document.body.style.transition = 'opacity 1.5s';
    document.body.style.opacity = '0';
    setTimeout(() => {
      window.location.href = 'shag1.html';
    }, 1500);
  });

  document.addEventListener('contextmenu', e => e.preventDefault());

  window.addEventListener('load', () => {
    setTimeout(typeNext, 1200);
  });
</script>
</body>
</html>
